name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # Android versionCode algorithm: major*10000 + minor*100 + patch
          # This ensures monotonically increasing integer version codes.
          # Examples:
          #   v0.3.0   -> 0*10000 + 3*100  + 0  = 300
          #   v1.2.5   -> 1*10000 + 2*100  + 5  = 10205
          #   v2.0.0   -> 2*10000 + 0*100  + 0  = 20000
          # Maximum supported version: 214.74.83 (versionCode = 2147483647, Int.MAX_VALUE)
          IFS='.' read -r major minor patch <<< "$VERSION"
          CODE=$((major * 10000 + minor * 100 + ${patch:-0}))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_OUTPUT"

      - name: Test and build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
